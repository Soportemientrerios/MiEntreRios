<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constitución de S.A.S. – Entre Ríos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#5d6878;--ac:#1f5fa8;--bd:#d5dae2;--mk:#fff1b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181f;--card:#1d232d;--tx:#e8ecf2;--mu:#9aa5b5;--ac:#6aa7ea;--bd:#364050;--mk:#5a4b10}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--bd);background:var(--card)}h1{font-size:19px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px}
h2{font-size:18px;margin:0 0 4px}.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);width:100%}
input:focus,select:focus{outline:2px solid var(--ac)}
.btns{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}button.s{background:transparent;color:var(--ac)}
.err{color:#c0392b;font-size:14px;margin-top:10px;min-height:1em}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;cursor:pointer;color:var(--tx);flex-direction:row;font-size:15px}
.opt input{width:auto;margin-top:4px}.opt small{display:block;color:var(--mu);font-size:12px}
.opt.on{border-color:var(--ac)}h3{font-size:15px;margin:16px 0 8px}
#pv{max-height:80vh;overflow:auto;font:13.5px/1.55 Georgia,serif;position:sticky;top:8px}#pv p{margin:0 0 9px;text-align:justify}#pv .c{text-align:center;font-weight:700}#pv .h{font-weight:700}
mark{background:var(--mk);color:inherit;padding:0 2px;border-radius:3px}
.wm{display:none}
@media print{.wm{display:block;position:fixed;top:50%;left:50%;width:140mm;transform:translate(-50%,-50%);opacity:.1;z-index:0;pointer-events:none}body{background:#fff!important}header,main>section:first-child,main>section:last-child>h2,main>section:last-child>.sub{display:none!important}main{display:block;padding:0;position:relative;z-index:1}main>section{border:0;padding:0;background:transparent}#pv{max-height:none;overflow:visible;position:static;color:#000!important;font-size:11.5pt}mark{background:none;color:#000}mark::before{content:"["}mark::after{content:"]"}@page{margin:20mm}}
</style></head><body>

<script>
const D={"fx": {"a6": "Las acciones que se emitan podrán ser ordinarias nominativas no endosables, escriturales o preferidas. Las acciones ordinarias pueden ser: de clase “A” que confieren derecho a cinco votos por acción, y de la clase “B” que confieren derecho a un voto por acción. Las acciones preferidas tendrán derecho a un dividendo de pago preferente, de carácter acumulativo o no, conforme a las condiciones de emisión, también podrán fijárseles una participación adicional en las ganancias. Las acciones que se emitan deberán indicar su valor nominal y los derechos económicos y políticos reconocidos a cada clase conforme al art. 46º, 47º y 48º de la Ley 27.349.", "a8": "La representación y uso de la firma social estará a cargo del Administrador titular, en caso de ausencia o impedimento corresponderá a la reunión de socios, o en su caso al socio único la designación de su reemplazante. Durará en su cargo mientras no sea removido por justa causa.", "a9": "Todas las resoluciones sociales de la sociedad se asentarán en el libro de Actas que se llevará a tales efectos y las disposiciones se tomarán en un todo de acuerdo a lo prescripto por el art. 53º de la Ley 27.349 y concordantes de la Ley 19.550. De las deliberaciones de las reuniones de socios deberán labrarse actas, las que resumirán las manifestaciones efectuadas, el sentido de las votaciones y su resultado, con expresión completa de las decisiones adoptadas. El quórum para cualquier reunión se forma con la presencia de socios que representen más de la mitad del capital social. Las decisiones sociales que tiendan a introducir modificaciones en el contrato social deben ser tomadas por decisiones de más de la mitad del capital social. Las resoluciones sociales que no conciernen a la modificación del contrato, la designación o revocación de administradores o representantes se adoptarán por mayoría del capital presente en la reunión. A los administradores y representantes legales se les aplicará lo normado por el art. 157º LGS. –", "a10": "La sociedad prescinde de órgano de fiscalización, adquiriendo los accionistas las facultades de contralor conforme el art. 55º LGS. -", "a12": "Las ganancias realizadas y líquidas se destinarán: a) el cinco por ciento (5%), hasta alcanzar el veinte por ciento (20%) del capital suscripto, para el fondo de la Reserva Legal. b) la remuneración del órgano de administración y representación, en su caso. c) a reservas facultativas, conforme lo previsto en el artículo 70º in fine de la Ley 19.550. d) a dividendos de las acciones preferidas, y con prioridad los acumulativos impagos. e) a dividendo de acciones ordinarias. f) el saldo, al destino que fije la reunión de socios.", "a13": "Los dividendos deberán ser pagados, en proporción a las respectivas integraciones, dentro del ejercicio en que fueron aprobados.", "a14": "Disuelta la sociedad por cualquiera de las causales previstas por el artículo 94º de la Ley 19.550, la liquidación será practicada por el o los liquidadores designados por la reunión de socios quienes deberán actuar conforme a lo dispuesto en los artículos 101º, siguientes y concordantes de la Ley 19.550.", "a7": ["La administración estará a cargo de uno o más administradores titulares, quienes, en el desempeño de sus funciones, actuarán en forma individual o colegiada, según corresponda, y tendrán todas las facultades necesarias para realizar los actos y celebrar los contratos tendientes al cumplimiento del objeto social.", "Los administradores permanecerán en sus cargos mientras no sean removidos por justa causa.", "Deberá designarse, asimismo, al menos un administrador suplente, quien asumirá en caso de vacancia de alguno de los administradores titulares."]}, "obj": [{"t": "TRANSPORTE", "b": "La sociedad tiene por objeto realizar por cuenta propia y/o de terceros, o asociadas a terceros en el país, las siguientes actividades: Transporte nacional de cargas generales, mercaderías a granel, ganado en pie, cereales. Transporte de sustancias alimenticias en general. Muebles, por cuenta propia y de terceros, encomiendas por vía terrestre con medios de transporte propios o de terceros, pudiendo realizar todo lo inherente a su logística.", "x": ""}, {"t": "INMOBILIARIO", "b": "La sociedad tiene por objeto realizar por cuenta propia y/o de terceros, o asociadas a terceros en el país, las siguientes actividades: Realizar compra, venta y permuta, explotación, arrendamientos y administración de bienes inmuebles propios, sean urbanos y/o rurales.", "x": ""}, {"t": "CONSTRUCCIÓN", "b": "La sociedad tiene por objeto realizar por cuenta propia y/o de terceros, o asociadas a terceros en el país, las siguientes actividades: Realizar la construcción de todo tipo de obras, públicas o privadas, sean a través de contrataciones directas o de licitaciones, para la construcción de edificios, viviendas, locales comerciales y plantas industriales; realizar refacciones, remodelaciones, instalaciones, trabajos de albañilería y/o cualquier trabajo de la construcción. Las actividades que en virtud de la materia lo requieran, serán ejercidas por profesionales con título habilitante.", "x": ""}, {"t": "AGROPECUARIO", "b": "La sociedad tiene por objeto realizar por cuenta propia y/o de terceros, o asociadas a terceros en el país, las siguientes actividades: Realizar la prestación de servicios y/o explotación directa por sí o por terceros en establecimientos rurales, ganaderos, agrícolas, frutícolas, forestales, propiedad de la sociedad o de terceras personas, cría, venta y cruza de ganado, hacienda de todo tipo, explotación de tambos, cultivos, compra, venta y acopio de cereales, incorporación y recuperación de tierras áridas. Elaboración de productos lácteos o de ganadería, o la ejecución de otras operaciones y procesos agrícolas y/o ganaderos, así como la compra, venta, distribución, importación y exportación de todas las materias primas derivadas de la explotación agrícola y ganadera. Transporte automotor de haciendas y/o productos alimenticios. Fabricación, industrialización y elaboración de productos y subproductos de la ganadería, de la alimentación, forestales, madereros, así como toda clase de servicios en plantas industriales propias de terceros en el país, referido a dichas actividades. Faena y comercialización de animales y de productos y subproductos derivados: industriales, faena de semovientes, incluyendo el trozado y elaboración de carnes, subproductos y sus derivados. Compraventa, importación y exportación, consignación o permuta de semovientes, animales, productos cárneos, subproductos y sus derivados. Comercialización de productos agrícolas, fertilizantes, herbicidas, plaguicidas y agroquímicos, compra, venta, consignación, acopio, distribución, exportación e importación de cereales, oleaginosas, forrajes, pasturas, alimentos balanceados, semillas, fertilizantes, herbicidas, plaguicidas, agroquímicos y todo tipo de productos que se relaciones con esta actividad. También podrá actuar como corredor, comisionista o mandataria de los productos mencionados precedentemente de acuerdo con las normas que dicte la autoridad competente. Administración, gerenciamiento y dirección técnica y profesional de los establecimientos rurales agrícolas o ganaderos de todo tipo. Las actividades que en virtud de la materia lo requieran, serán ejercidas por profesionales con título habilitante.", "x": ""}, {"t": "INFORMÁTICO", "b": "La sociedad tiene por objeto realizar por cuenta propia y/o de terceros, o asociadas a terceros en el país o en el extranjero, las siguientes actividades: Creación, producción, elaboración, transformación, desarrollo, reparación, implementación, servicio técnico, consultoría, comercialización, distribución, importación y exportación de softwares, hardware, equipos informáticos, eléctricos y electrónicos.", "x": ""}, {"t": "SOFTWARE E INTELIGENCIA ARTIFICIAL", "b": "La sociedad tiene por objeto realizar por cuenta propia y/o de terceros, o asociadas a terceros if(A.aut)P('p',`Autorizar a ${M(A.an,'nombre')}, D.N.I. N° ${M(A.ad,'DNI')}, CUIT/CUIL N° ${M(A.ac,'CUIT/CUIL')}, con domicilio especial en la ciudad de ${M(A.ci,'ciudad')}, Provincia de Entre Ríos, para que realicen todos los trámites necesarios para la inscripción en el Registro Público del presente instrumento, facultándolos para presentar y retirar documentación, realizar depósitos bancarios y extraerlos, aceptar las observaciones que formule la Dirección de Inspección de Personas Jurídicas y proceder con arreglo a ellas.`);return B}
const pf=(p,m)=>`<div class="g">${inp(p+'nombre','Apellido y nombres')}${inp(p+'dni','D.N.I. N°','text',dni)}${inp(p+'cuit','CUIT/CUIL N°','text',cuit)}${inp(p+'nac','Fecha de nacimiento','date')}${sel(p+'ec','Estado civil',EC)}${inp(p+'nacio','Nacionalidad')}${sel(p+'sexo','Sexo',['Femenino','Masculino','Otro'])}${inp(p+'prof','Profesión')}${inp(p+'dom','Domicilio real (calle y número)')}${inp(p+'ciu','Ciudad')}${inp(p+'dep','Departamento')}${inp(p+'prov','Provincia')}${inp(p+'pais','País')}${m?inp(p+'mail','Correo electrónico','email'):''}</div>`;
function steps(){const T=[];
T.push({t:'Denominación',s:'Se completará automáticamente en el encabezado, en el artículo PRIMERO y en el artículo 1º. No escriba “S.A.S.”: se agrega sola.',h:()=>`<div class="g">${inp('den','Denominación de la sociedad')}</div>`});
T.push({t:'Cantidad de socios',s:'Se generará una ficha de datos por cada socio.',h:()=>`<div class="g">${inp('n','Número de socios','number','min="1" max="20"')}</div>`,c:()=>{const n=Math.max(1,Math.min(20,+S.n||1));S.n=n;while(S.soc.length<n)S.soc.push({});S.soc.length=n}});
S.soc.forEach((o,i)=>T.push({t:`Socio ${i+1} de ${S.soc.length}`,s:'Complete todos los datos obligatorios.',h:()=>pf(`soc.${i}.`,1)+`<label class="opt" style="margin-top:14px"><input type="checkbox" data-r="${i}" ${o.rep?'checked':''}><span>Este socio actúa representado por otra persona<small>Solo en caso que corresponda</small></span></label>`+(o.rep?`<h3>Datos del representante</h3>`+pf(`soc.${i}.r.`,0):'')}));
T.push({t:'Lugar y fecha del acta',s:'',h:()=>`<div class="g">${inp('lug.ciu','Ciudad')}${sel('lug.dep','Departamento',DEP)}${inp('lug.dia','Día','number','min="1" max="31"')}${sel('lug.mes','Mes',MES)}${inp('lug.anio','Año','number','min="2024"')}</div>`});
T.push({t:'Domicilio, duración y sede social',s:'La sede debe estar en la ciudad del domicilio social.',h:()=>`<div class="g">${inp('dom.ciu','Ciudad del domicilio social')}${sel('dom.dep','Departamento',DEP)}${inp('dom.anios','Duración (años, número entero)','number','min="1" step="1"')}${inp('dom.calle','Sede social: calle y número')}<label>Piso (opcional)<input data-k="dom.piso" value="${esc(S.dom.piso)}"></label><label>Dpto. (opcional)<input data-k="dom.dpto" value="${esc(S.dom.dpto)}"></label></div>`});
T.push({t:'Objeto social (art. 4º)',s:'Elija al menos un objeto de los disponibles. Puede marcar más de uno.',h:()=>D.obj.map((o,i)=>`<label class="opt ${S.obj.includes(i)?'on':''}"><input type="checkbox" data-o="${i}" ${S.obj.includes(i)?'checked':''}><span>${esc(o.t)}<small>${esc(o.b.slice(0,150))}…</small></span></label>`).join(''),v:()=>S.obj.length?'':'Debe seleccionar al menos un objeto.'});
T.push({t:'Capital social y suscripción',s:'Ingrese números enteros sin decimales. Los montos en letras se generan solos.',h:()=>`<div class="g">${inp('cap.num','Capital social ($)','number','min="1" step="1"')}${inp('cap.acc','Cantidad de acciones','number','min="1" step="1"')}${inp('cap.vn','Valor nominal de cada acción ($)','number','min="1" step="1"')}</div><h3>Acciones suscriptas por cada socio</h3><div class="g">${S.soc.map((o,i)=>inp(`soc.${i}.acc`,'Acciones de '+(o.nombre||'socio '+(i+1)),'number','min="1" step="1"')).join('')}</div><p class="sub" id="tot" style="margin-top:10px"></p><h3>Integración del capital (25% en efectivo)</h3>`+[['A','Opción A','Constancia bancaria de depósito en garantía'],['B','Opción B (sugerida)','Acta notarial']].map(([v,a,b])=>`<label class="opt ${S.ij==v?'on':''}"><input type="radio" name="ij" data-i="${v}" ${S.ij==v?'checked':''}><span>${a}<small>${b}</small></span></label>`).join(''),v:()=>{const C=S.cap;if(+C.num!=C.acc*C.vn)return'El capital social debe ser igual a la cantidad de acciones por el valor nominal.';if(S.soc.reduce((a,o)=>a+(+o.acc||0),0)!=+C.acc)return'La suma de acciones suscriptas por los socios debe ser igual al total de acciones.';return S.ij?'':'Debe elegir una modalidad de integración.'}});
T.push({t:'Cierre de ejercicio',s:'',h:()=>`<div class="g">${inp('ej.dia','Día (1 al 31)','number','min="1" max="31" step="1"')}${sel('ej.mes','Mes',MES)}</div>`});
T.push({t:'Administración y autorizado',s:'',h:()=>{const A=S.ad;return `<h3>Administrador titular</h3><div class="g">${inp('ad.tn','Apellido y nombres')}${inp('ad.td','D.N.I. N°','text',dni)}</div><h3>Administrador suplente</h3><div class="g">${inp('ad.sn','Apellido y nombres')}${inp('ad.sd','D.N.I. N°','text',dni)}</div></div><label class="opt" style="margin-top:14px"><input type="checkbox" data-a="1" ${A.aut?'checked':''}><span>Designar un autorizado para tramitar la inscripción<small>Opcional</small></span></label>${A.aut?`<div class="g">${inp('ad.an','Apellido y nombres')}${inp('ad.ad','D.N.I. N°','text',dni)}${inp('ad.ac','CUIT/CUIL N°','text',cuit)}${inp('ad.ci','Ciudad del domicilio especial')}</div>`:''}`}});
T.push({t:'Finalizar',s:'Revise la vista previa del contrato. Si todo es correcto, genere el PDF.',h:()=>`<button id="pdf">Generar PDF (imprimir / guardar como PDF)</button><p class="sub" id="pm" style="margin-top:12px"></p>`,fin:1});
return T}
let st=0;
function render(){const T=steps(),X=T[st];document.getElementById('pg').style.width=(st+1)/T.length*100+'%';
fm.innerHTML=`<h2>${st+1}. ${X.t}</h2><p class="sub">${X.s}</p>`+X.h();er.textContent='';bk.style.visibility=st?'visible':'hidden';nx.style.display=X.fin?'none':'';
fm.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{set(e.dataset.k,e.value);if(S.soc.length==1&&e.dataset.k=='cap.acc'){S.soc[0].acc=e.value;const q=fm.querySelector('[data-k="soc.0.acc"]');if(q)q.value=e.value}tt();pv()});
fm.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>{S.soc[e.dataset.r].rep=e.checked;render();pv()});
fm.querySelectorAll('[data-o]').forEach(e=>e.onchange=()=>{const i=+e.dataset.o;S.obj=e.checked?[...S.obj,i].sort((a,b)=>a-b):S.obj.filter(x=>x!=i);e.closest('.opt').classList.toggle('on',e.checked);pv()});
fm.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>{S.ad.aut=e.checked;render();pv()});
fm.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{S.ij=e.dataset.i;render();pv()});
if(X.fin)document.getElementById('pdf').onclick=mk;tt();pv()}
function tt(){const t=document.getElementById('tot');if(!t)return;const a=S.soc.reduce((x,o)=>x+(+o.acc||0),0),T=+S.cap.acc||0;t.textContent=`Acciones asignadas a los socios: ${nf(a)} de ${nf(T)}`+(T&&a==T?' ✔':T?` (faltan ${nf(T-a)})`:'');t.style.color=T&&a==T?'var(--ac)':''}
function pv(){document.getElementById('pv').innerHTML=blocks().map(([t,s])=>`<p class="${t}">${esc(s).replace(/«([^»]*)»/g,'<mark>$1</mark>')}</p>`).join('')}
nx.onclick=()=>{const T=steps(),X=T[st],ins=[...fm.querySelectorAll('input,select')];const bad=ins.find(i=>!i.checkValidity());if(bad){bad.reportValidity();return}
if(X.c){X.c()}const e=X.v&&X.v();if(e){er.textContent=e;er.scrollIntoView({block:'center'});return}st++;render();scrollTo(0,0)};
bk.onclick=()=>{st--;render()};
function mk(){const n=S.den.trim().replace(/[^\wÁÉÍÓÚÑáéíóúñ]+/g,'_')||'SAS';document.title='Acta_constitutiva_'+n;document.getElementById('pm').textContent='En la ventana de impresión elija “Guardar como PDF” (destino) y guarde el archivo.';setTimeout(()=>window.print(),150)}
render();
</script></body></html>
